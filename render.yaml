services:
  - type: web
    name: medha
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: MEDHA_STATE_DIR
        value: /data/.medha
      - key: MEDHA_WORKSPACE_DIR
        value: /data/workspace
      - key: MEDHA_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: medha-data
      mountPath: /data
      sizeGB: 1
