services:
  medha-gateway:
    image: ${MEDHA_IMAGE:-medha:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      MEDHA_GATEWAY_TOKEN: ${MEDHA_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${MEDHA_CONFIG_DIR}:/home/node/.medha
      - ${MEDHA_WORKSPACE_DIR}:/home/node/.medha/workspace
    ports:
      - "${MEDHA_GATEWAY_PORT:-18789}:18789"
      - "${MEDHA_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${MEDHA_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  medha-cli:
    image: ${MEDHA_IMAGE:-medha:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      MEDHA_GATEWAY_TOKEN: ${MEDHA_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${MEDHA_CONFIG_DIR}:/home/node/.medha
      - ${MEDHA_WORKSPACE_DIR}:/home/node/.medha/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
